# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/Overlay-Specification/refs/heads/main/schemas/v1.0/schema.yaml
# Fixes for Go identifier collisions and wrong types in the upstream Plex
# specification.
overlay: 1.0.0
info:
  title: Plex Media Server Go fixes
  version: 1.0.0
actions:
  # Fields documented as boolean that Plex Media Server sends as 0 or 1.
  # Bool (bool.go) decodes both, so callers keep working with a boolean.
  - target: $.components.schemas.librarySection.properties.hidden
    update:
      x-go-type: Bool
  - target: $.components.schemas.media.properties.optimizedForStreaming
    update:
      x-go-type: Bool
  # `metadata.Guid` reuses `tag`, whose id is an integer, but Plex Media
  # Server sends external agent identifiers such as "tvdb://376944".
  - target: $.components.schemas
    update:
      guid:
        description: An identifier of a metadata item at an external agent, e.g. "imdb://tt0111161", "tmdb://278" or "tvdb://12345".
        type: object
        properties:
          id:
            type: string
            example: tvdb://12345
  - target: $.components.schemas.metadata.properties.Guid.items
    update:
      $ref: "#/components/schemas/guid"
  # `mediaContainer` (an object wrapping a `MediaContainer` property) and
  # `MediaContainer` (the container itself) both map to the Go name MediaContainer.
  - target: $.components.schemas.mediaContainer
    update:
      x-go-name: MediaContainerRoot
  # `metadata` has both `Rating` (a list of rating tags) and `rating` (a
  # numeric rating), which both map to the Go field name Rating.
  - target: $.components.schemas.metadata.properties.Rating
    update:
      x-go-name: Ratings
  # Shared parameters are keyed "2".."35" upstream, which would generate the
  # Go types N2..N35. Name them after the parameter instead.
  - target: $.components.parameters["2"]
    update:
      x-go-name: AdvancedSubtitlesParam
  - target: $.components.parameters["3"]
    update:
      x-go-name: AudioBoostParam
  - target: $.components.parameters["4"]
    update:
      x-go-name: AudioChannelCountParam
  - target: $.components.parameters["5"]
    update:
      x-go-name: NormalizeLoudnessParam
  - target: $.components.parameters["6"]
    update:
      x-go-name: BoostDialogParam
  - target: $.components.parameters["7"]
    update:
      x-go-name: AutoAdjustQualityParam
  - target: $.components.parameters["8"]
    update:
      x-go-name: AutoAdjustSubtitleParam
  - target: $.components.parameters["9"]
    update:
      x-go-name: DirectPlayParam
  - target: $.components.parameters["10"]
    update:
      x-go-name: DirectStreamParam
  - target: $.components.parameters["11"]
